<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/mediaquery.css">
</head>
<body>
    <div class="container">
      <div class="head">
        <h2 class="title">Form Title</h2>
        <p class="description">This is the description of the form.</p>
      </div>
  
      <div class="divider"></div>
  
      <form action="/" method="POST">
        <div class="input">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
        </div>
  
        <div class="input">
          <label for="phone">Phone Number</label> 
          <input type="number" id="phone" name="phone" placeholder="Phone Number" min="0" required>
        </div>
  
        <div class="textarea input">
          <label for="address">Address</label>
          <textarea name="address" id="address" placeholder="Address" rows="2" required></textarea>
        </div>
  
        <div class="input">
          <label for="company">Company Name</label>
          <input type="text" id="company" name="company" placeholder="Company Name" required>
        </div>
  
        <div class="input">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required>
        </div>
  
        <div class="dropdown">
          <label for="department">Department</label>
          <select name="department" id="department" required>
            <option selected disabled>Choose an option</option>
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="Development">Development</option>
            <option value="Marketing">Marketing</option>
          </select>
        </div>
  
        <div class="gender">
          <p class="label">Gender:</p> 
          <input type="radio" id="male" name="gender" value="male" required>
          <label for="male">Male</label>
  
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
  
          <input type="radio" id="other" name="gender" value="prefer not to say">
          <label for="other">Prefer not to say</label>
        </div>
  
        <div class="submit">
          <input type="submit" value="Submit">
        </div>
      </form>
    </div>
  </body>
  
</html>
